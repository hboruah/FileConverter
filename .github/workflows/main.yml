name: Build File Converter 2.2.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download FFmpeg 9.0 full
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/9.0/ffmpeg-9.0-full_build.7z"
          $archive = "$env:RUNNER_TEMP\ffmpeg.7z"
          $extract = "$env:RUNNER_TEMP\ffmpeg"

          Invoke-WebRequest -Uri $url -OutFile $archive

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          7z x $archive "-o$extract" -y

          $ffmpeg = Get-ChildItem -Path $extract -Filter "ffmpeg.exe" -Recurse |
                    Select-Object -First 1

          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }

          New-Item -ItemType Directory -Force -Path "Middleware\ffmpeg" | Out-Null
          Copy-Item $ffmpeg.FullName "Middleware\ffmpeg\ffmpeg.exe" -Force

          Write-Host "Downloaded FFmpeg:"
          & "Middleware\ffmpeg\ffmpeg.exe" -version

      - name: Restore NuGet packages
        run: nuget restore FileConverter.sln

      - name: Build File Converter
        run: >
          msbuild Application\FileConverter\FileConverter.csproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:RestorePackagesConfig=true

      - name: Copy FFmpeg to application output
        shell: pwsh
        run: |
          $source = "Middleware\ffmpeg\ffmpeg.exe"
          $outputDir = "Application\FileConverter\bin\x64\Release"
          $destination = "$outputDir\ffmpeg.exe"

          if (-not (Test-Path $source)) {
            throw "Source FFmpeg was not found: $source"
          }

          if (-not (Test-Path $outputDir)) {
            throw "Application output directory was not found: $outputDir"
          }

          Copy-Item $source $destination -Force

          if (-not (Test-Path $destination)) {
            throw "FFmpeg could not be copied to the application output directory."
          }

          Write-Host "FFmpeg successfully copied to:"
          Write-Host $destination

          & $destination -version

      - name: Build installer
        run: >
          msbuild Installer\Installer.wixproj
          /p:Configuration=Release
          /p:Platform=x64

      - name: Verify installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Installer\bin\x64\Release\*.msi" |
                 Select-Object -First 1

          if (-not $msi) {
            throw "MSI installer was not created."
          }

          Write-Host "Installer created successfully:"
          Write-Host $msi.FullName
          Write-Host "Size: $($msi.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-2.2.1-x64
          path: Installer\bin\x64\Release\*.msi
          if-no-files-found: error
