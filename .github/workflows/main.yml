name: Build File Converter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore FileConverter.sln

      - name: Build File Converter
        run: msbuild Application\FileConverter\FileConverter.csproj /p:Configuration=Release /p:Platform=x64 /p:RestorePackagesConfig=true

      - name: Upload File Converter
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-AVIF-Patched
          path: Application\FileConverter\bin\x64\Release\
