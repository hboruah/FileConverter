name: Build File Converter 2.2.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------------
      # FFmpeg 9.0 full build from Gyan.dev
      # ------------------------------------------------------------
      - name: Download FFmpeg 9.0 full
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z"
          $archive = "$env:RUNNER_TEMP\ffmpeg.7z"
          $extract = "$env:RUNNER_TEMP\ffmpeg"

          Write-Host "Downloading FFmpeg 9.0 full..."

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 600 `
            -o $archive `
            $url

          if ($LASTEXITCODE -ne 0) {
              throw "FFmpeg download failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $archive)) {
              throw "FFmpeg archive was not downloaded."
          }

          $size = (Get-Item $archive).Length
          Write-Host "FFmpeg archive size: $([math]::Round($size / 1MB, 2)) MB"

          if ($size -lt 1MB) {
              throw "Downloaded FFmpeg archive appears to be invalid."
          }

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          7z x $archive "-o$extract" -y

          if ($LASTEXITCODE -ne 0) {
              throw "FFmpeg archive extraction failed."
          }

          $ffmpeg = Get-ChildItem `
            -Path $extract `
            -Filter "ffmpeg.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $ffmpeg) {
              throw "ffmpeg.exe was not found in the downloaded archive."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "Middleware\ffmpeg" |
            Out-Null

          Copy-Item `
            $ffmpeg.FullName `
            "Middleware\ffmpeg\ffmpeg.exe" `
            -Force

          Write-Host "FFmpeg found at:"
          Write-Host $ffmpeg.FullName

          Write-Host "FFmpeg version:"
          & "Middleware\ffmpeg\ffmpeg.exe" -version

      # ------------------------------------------------------------
      # Restore NuGet packages
      # ------------------------------------------------------------
      - name: Restore NuGet packages
        run: nuget restore FileConverter.sln

      # ------------------------------------------------------------
      # Build File Converter
      # ------------------------------------------------------------
      - name: Build File Converter
        run: |
          msbuild Application\FileConverter\FileConverter.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestorePackagesConfig=true

      # ------------------------------------------------------------
      # Copy FFmpeg into application output
      # ------------------------------------------------------------
      - name: Copy FFmpeg to application output
        shell: pwsh
        run: |
          $output = "Application\FileConverter\bin\x64\Release"

          if (-not (Test-Path "$output\FileConverter.exe")) {
              throw "FileConverter.exe was not found in the application output."
          }

          if (-not (Test-Path "Middleware\ffmpeg\ffmpeg.exe")) {
              throw "FFmpeg was not found."
          }

          Copy-Item `
            "Middleware\ffmpeg\ffmpeg.exe" `
            "$output\ffmpeg.exe" `
            -Force

          Write-Host "FFmpeg copied successfully."

          & "$output\ffmpeg.exe" -version

      # ------------------------------------------------------------
      # Ghostscript 10.02.1
      #
      # Download the official Artifex Windows x64 installer and
      # extract it directly. Ghostscript does NOT need to be
      # installed on the GitHub runner.
      # ------------------------------------------------------------
      - name: Download Ghostscript 10.02.1
        shell: pwsh
        run: |
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10021/gs10021w64.exe"
          $installer = "$env:RUNNER_TEMP\gs10021w64.exe"
          $extract = "$env:RUNNER_TEMP\Ghostscript"

          Write-Host "Downloading Ghostscript 10.02.1..."

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 600 `
            -o $installer `
            $url

          if ($LASTEXITCODE -ne 0) {
              throw "Ghostscript download failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $installer)) {
              throw "Ghostscript installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          Write-Host "Ghostscript installer size: $([math]::Round($size / 1MB, 2)) MB"

          if ($size -lt 1MB) {
              throw "Downloaded Ghostscript installer appears to be invalid."
          }

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extract |
            Out-Null

          Write-Host "Extracting Ghostscript installer..."

          7z x $installer "-o$extract" -y

          if ($LASTEXITCODE -ne 0) {
              throw "Ghostscript installer extraction failed."
          }

          # Find the two files required by File Converter's installer.
          $gsExe = Get-ChildItem `
            -Path $extract `
            -Filter "gswin64c.exe" `
            -Recurse |
            Select-Object -First 1

          $gsDll = Get-ChildItem `
            -Path $extract `
            -Filter "gsdll64.dll" `
            -Recurse |
            Select-Object -First 1

          if (-not $gsExe) {
              throw "gswin64c.exe was not found in the Ghostscript package."
          }

          if (-not $gsDll) {
              throw "gsdll64.dll was not found in the Ghostscript package."
          }

          $output = "Application\FileConverter\bin\x64\Release"

          Copy-Item `
            $gsExe.FullName `
            "$output\gswin64c.exe" `
            -Force

          Copy-Item `
            $gsDll.FullName `
            "$output\gsdll64.dll" `
            -Force

          Write-Host "Ghostscript executable:"
          Write-Host $gsExe.FullName

          Write-Host "Ghostscript DLL:"
          Write-Host $gsDll.FullName

      # ------------------------------------------------------------
      # Verify all middleware required by the installer
      # ------------------------------------------------------------
      - name: Verify application middleware
        shell: pwsh
        run: |
          $output = "Application\FileConverter\bin\x64\Release"

          $required = @(
              "FileConverter.exe",
              "ffmpeg.exe",
              "gsdll64.dll",
              "gswin64c.exe"
          )

          foreach ($file in $required) {
              $path = Join-Path $output $file

              if (-not (Test-Path $path)) {
                  throw "Required file is missing: $path"
              }

              $size = (Get-Item $path).Length

              if ($size -eq 0) {
                  throw "Required file is empty: $path"
              }

              Write-Host "Found: $file ($size bytes)"
          }

          Write-Host ""
          Write-Host "All required middleware files are present."

      # ------------------------------------------------------------
      # Build installer
      # ------------------------------------------------------------
      - name: Build installer
        run: |
          msbuild Installer\Installer.wixproj `
            /p:Configuration=Release `
            /p:Platform=x64

      # ------------------------------------------------------------
      # Verify MSI
      # ------------------------------------------------------------
      - name: Verify installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            -Path "Installer\bin\x64\Release" `
            -Filter "*.msi" `
            -Recurse |
            Select-Object -First 1

          if (-not $msi) {
              throw "Installer MSI was not produced."
          }

          Write-Host "Installer created:"
          Write-Host $msi.FullName
          Write-Host "Size: $([math]::Round($msi.Length / 1MB, 2)) MB"

      # ------------------------------------------------------------
      # Upload MSI
      # ------------------------------------------------------------
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-2.2.1-x64
          path: Installer\bin\x64\Release\*.msi
          if-no-files-found: error
